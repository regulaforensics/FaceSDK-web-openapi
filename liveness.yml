openapi: 3.0.4

paths:
  /v2/liveness:
    get:
      parameters:
        - $ref: "./common.yml#/components/parameters/transactionId"
      tags:
        - liveness 2.0
      summary: 'liveness check'
      description: "To verify the presence of a real person in front of a camera, use the GET `/api/v2/liveness` endpoint. When starting, you can specify `tag` which all attempts to read liveness will be bound to. If left unspecified, the application automatically generates one. The calling application returns `tag` and `transactionId`. One session may include many transactions, and from a transaction ID it is clear which session it belongs to.


      When specifying `tag`, note that only Latin uppercase and lowercase letters, digits, and symbols `-` and `_` are allowed. The maximum supported number of characters is 127.


      The metadata (device model, screen data, frame size, app ID and version, OS version, platform, SDK version, etc.), a person's selfie and video of the liveness detection session are stored on the backend at:
      `faceapi-session/year={year}/month={month}/day={day}/hour={hour}/minute={minute}/{tag}/transactionId`


      By default, liveness checks operate with eventual consistency. This means that when you submit a request and receive a response, the associated data (like the selfie and session video) may be saved after the response is sent. If this doesn't meet your requirements, you can switch to strong consistency; refer to the [Architecture page](https://docs.regulaforensics.com/develop/face-sdk/overview/architecture/#consistency-models) for details.


      To access the liveness transaction data, use GET `/api/v2/liveness?transactionId={transactionId}`.
      "
      operationId: get_liveness_transaction_info
      responses:
        200:
          description: Get liveness transaction info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionInfo"
    delete:
      parameters:
        - $ref: "./common.yml#/components/parameters/transactionId"
        - $ref: "./common.yml#/components/parameters/tag"
      tags:
        - liveness 2.0
      summary: delete liveness transaction
      description: "This endpoint deletes a liveness transaction based on either the specified `tag` or `transactionId`. At least one of the parameters must be provided for the operation to be valid."
      operationId: delete_liveness_transaction
      responses:
        204:
          $ref: "#/components/responses/SuccessEmpty"

components:
  schemas:
    TransactionInfo:
      title: "TransactionInfo"
      type: object
      properties:
        code:
          type: integer
          description: "Result code, see the [FaceSDKResultCode enum](https://docs.regulaforensics.com/develop/face-sdk/web-service/development/enums/face-sdk-result-code/)."
        status:
          type: integer
          default: null
          description: "Whether the liveness detection is confirmed `0` or not `1`."
        tag:
          type: string
          description: "Session identificator, should be unique for each session."
        transactionId:
          type: string
          description: "Transaction ID, there can be several transactions within one session."
        video:
          type: string
          description: "Link to the session video, depends on the selected storage type. [Learn more](https://docs.regulaforensics.com/develop/face-sdk/web-service/administration/storage/)"
        age:
          type: array
          description: "Approximate age with an accuracy of +/-3 years."
          items:
            type: object
            additionalProperties: true
        portrait:
          type: string
          description: "Link to the portrait, depends on the selected storage type. [Learn more](https://docs.regulaforensics.com/develop/face-sdk/web-service/administration/storage/)"
        metadata:
          type: object
          additionalProperties: true
          description: "A free-form object containing person's extended attributes."
        type:
          $ref: "#/components/schemas/LivenessType"
        enrollResult:
          $ref: "#/components/schemas/EnrollResult"
        verifyResult:
          $ref: "#/components/schemas/VerifyResult"

    EnrollResult:
      title: "EnrollResult"
      type: object
      description: "Result of the enrollment that was requested for the session at its start (via the `enroll` parameter). Returned only when enrollment was requested and the enrollment module is enabled. Populated once the transaction reaches a successful liveness result."
      properties:
        enrolled:
          type: boolean
          description: "`true` when a new Person was created from the liveness portrait. `false` when the Person was not created because the preliminary 1:N search found matching Persons (see `search`)."
        person:
          allOf:
            - $ref: "./identification.yml#/components/schemas/Person"
          description: "The Person created by the enrollment. Present only when `enrolled` is `true`."
        search:
          $ref: "#/components/schemas/EnrollSearchResult"

    EnrollSearchResult:
      title: "EnrollSearchResult"
      type: object
      description: "Result of the preliminary 1:N search performed before enrollment when the `enroll.search` parameter was provided at session start. Present only when at least one matching Person was found; in that case the Person is not enrolled."
      properties:
        persons:
          type: array
          description: "Persons matched during the preliminary search."
          items:
            $ref: "./search.yml#/components/schemas/SearchPerson"

    VerifyResult:
      title: "VerifyResult"
      type: object
      description: "Result of the verification that was requested for the session at its start (via the `verify` parameter). Returned only when verification was requested and the enrollment module is enabled."
      properties:
        verified:
          type: boolean
          description: "`true` when liveness is confirmed and the liveness portrait matches the target Person above the requested threshold. `false` when liveness failed or the faces did not match."
        person:
          allOf:
            - $ref: "./identification.yml#/components/schemas/Person"
          description: "The target Person the portrait was verified against."
        match:
          $ref: "#/components/schemas/VerifyResultMatch"

    VerifyResultMatch:
      title: "VerifyResultMatch"
      type: object
      description: "Face comparison details. Absent when liveness was not confirmed."
      properties:
        verified:
          type: boolean
          description: "`true` when the face similarity is above the requested threshold."
        similarity:
          type: number
          format: float
          description: "Face similarity score in the range 0..1."

    LivenessType:
      title: "LivenessType"
      type: integer
      description: "Liveness detection can be performed in three modes: active `0`,  passive `1`, and passive with blink `2`. [Learn more](https://docs.regulaforensics.com/develop/face-sdk/web-service/development/usage/liveness/#active-and-passive-modes)"
      enum:
        - 0
        - 1
        - 2
      x-enum-varnames:
        - ACTIVE
        - PASSIVE
        - PASSIVE_WITH_BLINK

  responses:
    SuccessEmpty:
      description: "Successful operation, return nothing."