openapi: 3.0.4

paths:
  /search:
    parameters:
      - $ref: "./common.yml#/components/parameters/x-request"
      - in: query
        name: withImages
        required: false
        schema:
          type: boolean
        description: "Whether to include the matched Persons' images and their Base64-encoded content in the response. If set to `true`, each Person in the `persons` array includes the `images` field. If omitted or set to `false`, the `images` field is not returned."
    post:
      tags:
        - search
      summary: Find person by image in groups
      description: |
        Searches for Persons by a face image.

        Use `groupIds` to limit the search to specific groups and `filter` to additionally
        filter Persons by supported fields.

        By default, the operation only searches for existing Persons. To create a new Person
        when no matching Person is found, provide the `createPerson` object. In this case,
        the new Person is created using the descriptor calculated from the submitted search image.

        The `threshold` parameter defines the maximum face distance allowed for a match:
        lower values make the search stricter. The returned `distance` value indicates
        how close the matched face is to the submitted face; lower values indicate greater similarity.

        Set `detectAll` to `true` to detect and search for all faces in the submitted image.
        Otherwise, only the most central face is processed.

        Set the `withImages` query parameter to `true` to include the matched Persons'
        images and their Base64-encoded content in the response.
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        200:
          description: "Search completed successfully; matching Persons are returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        201:
          description: "A new Person was created because no matching Person was found and `createPerson` was provided in the request. The Person is created using the submitted search image and the data specified in `createPerson`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPerson"
        400:
          $ref: "./identification.yml#/components/responses/SearchBadParamsException"

components:
  schemas:
    SearchRequest:
      title: "SearchRequest"
      description: "Search request containing transaction labels, search options, and parameters of the image used to find matching Persons."
      allOf:
        - $ref: "./common.yml#/components/schemas/TransactionLabels"
        - $ref: "#/components/schemas/SearchParameters"
        - $ref: "./identification.yml#/components/schemas/ImageFields"

    SearchParameters:
      title: "SearchParameters"
      type: object
      description: "Parameters that control the search scope, filtering, and optional creation of a new Person when no match is found."
      properties:
        createPerson:
          $ref: "#/components/schemas/SearchParametersCreatePerson"
        groupIds:
          type: array
          description: "IDs of the groups in which the search is performed."
          items:
            type: string
            format: uuid
        filter:
          $ref: "#/components/schemas/FilterSearchRequest"

    SearchParametersCreatePerson:
      title: "SearchParametersCreatePerson"
      type: object
      description: "Enables automatic Person creation when the search returns no matching Person. When this object is provided and no match is found, a new Person is created using the descriptor calculated from the submitted search image and the data specified in this object. The operation returns HTTP 201. <br><br>If this object is omitted, the search does not create a Person."
      properties:
        name:
          type: string
          description: "Name assigned to the Person if a new Person is created."
        metadata:
          type: object
          additionalProperties: true
          description: "Free-form metadata assigned to the Person if a new Person is created."
        ttl:
          type: integer
          description: "Lifetime of the Person created through `createPerson`, seconds. This parameter applies only when the search creates a new Person."
          nullable: true

    FilterSearchRequest:
      title: "FilterSearchRequest"
      type: object
      description: "Applies an additional filter to Persons considered during the face search. Currently, filtering is supported only by the `name` field."
      properties:
        op:
          $ref: "#/components/schemas/FilterOp"
        field:
          type: string
          description: "The Person field to which the filter is applied. Currently, only `name` is supported. If another field is specified, the filter is ignored."
        value:
          type: array
          description: "The list of values against which the specified `field` is compared."
          items:
            type: string

    FilterOp:
      title: "FilterOp"
      type: string
      description: |
        Comparison operator applied to the Person `name` field.

        - `in` — the Person name must match one of the values specified in `value`.
        - `nin` — the Person name must not match any of the values specified in `value`.
      enum:
        - "in"
        - "nin"
      x-enum-varnames:
        - "IN"
        - "NOT_IN"

    RecognizeImage:
      title: "RecognizeImage"
      allOf:
        - $ref: "./identification.yml#/components/schemas/Image"
        - $ref: "#/components/schemas/RecognizeImageData"

    RecognizeImageData:
      title: "RecognizeImageData"
      type: object
      properties:
        similarity:
          type: number
          format: float
          description: "Similarity score."
        distance:
          type: number
          format: float
          description: |
            Face distance between the submitted search face and this Person image.
            Lower values indicate greater face similarity.
            The search `threshold` is applied to this value to determine whether
            the result qualifies as a match.

    SearchResult:
      title: "SearchResult"
      type: object
      properties:
        code:
          type: integer
          description: "Result code of the successful search operation."
        persons:
          type: array
          description: "Persons matched against the submitted search image. Each item contains Person data and search-specific match information."
          items:
            $ref: "#/components/schemas/SearchPerson"

    SearchPerson:
      title: "SearchPerson"
      allOf:
        - $ref: "./identification.yml#/components/schemas/Person"
        - $ref: "#/components/schemas/SearchPersonData"

    SearchPersonData:
      title: "SearchPersonData"
      type: object
      properties:
        detection:
          $ref: "#/components/schemas/SearchDetection"
        images:
          type: array
          description: "Images associated with the matched Person. This field is returned only when the `withImages` query parameter is `true`. Each image includes its Base64-encoded content."
          items:
            $ref: "#/components/schemas/RecognizeImage"

    SearchDetection:
      title: "SearchDetection"
      type: object
      description: "Detection data for the face from the submitted search image that produced this search result. The object contains the detected face region, facial landmarks, and processed portrait data returned according to the request settings."
      properties:
        code:
          type: integer
          description: "Internal."
        crop:
          type: string
          format: base64
          description: "Base64-encoded aligned and cropped portrait of the detected face. The output is generated according to the applicable `outputImageParams` settings in the search request."
        detectorType:
          type: integer
          description: "Internal."
        hash:
          type: string
          description: "Internal."
        idx:
          type: integer
          description: "Internal."
        image:
          type: string
          format: base64
          description: "Internal."
        landmarks:
          description: "Absolute coordinates of five facial landmarks, in this order: left eye, right eye, nose, left corner of the mouth, and right corner of the mouth."
          type: array
          items:
            description: "Facial landmark coordinates in the `[x, y]` format."
            type: array
            items:
              type: integer
            example: [ 10, 20 ]
          example:
            - [10, 20]
            - [30, 20]
            - [20, 30]
            - [14, 40]
            - [26, 40]
        landmarksType:
          type: integer
          description: "Internal."
          example: 2
        msg:
          type: string
          description: "Internal."
        roi:
          $ref: "./common.yml#/components/schemas/FaceRectangular"
        versionSDK:
          type: string
          example: "5.2.245.687"
