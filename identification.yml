openapi: 3.0.4

components:
  responses:
    SearchBadParamsException:
      description: "The search request contains invalid parameters."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchBadParams"

  schemas:
    SearchBadParams:
      title: "SearchBadParams"
      type: object
      properties:
        msg:
          type: string
          default: "Descriptor already calculated"
        statusCode:
          type: integer
          default: 400
        type:
          type: string
          default: "BadParamsException"

    PersonsPage:
      title: "PersonsPage"
      allOf:
        - $ref: "#/components/schemas/PersonItems"
        - $ref: "./common.yml#/components/schemas/Page"

    PersonItems:
      title: "PersonItems"
      type: object
      properties:
        items:
          type: array
          description: "Persons returned on the current page."
          items:
            $ref: "#/components/schemas/Person"

    Person:
      title: "Person"
      description: "Person record returned by the API, including Person attributes and service-generated data."
      allOf:
        - $ref: "#/components/schemas/PersonFields"
        - $ref: "#/components/schemas/PersonData"

    PersonData:
      title: "PersonData"
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Person ID."
        createdAt:
          type: string
          format: date-time
          description: "Person creation date and time."
        updatedAt:
          type: string
          format: date-time
          description: "Person update date and time."

    PersonFields:
      title: "PersonFields"
      type: object
      description: "Attributes used to create a Person."
      required:
        - name
      properties:
        name:
          type: string
          description: "Name assigned to the Person."
        externalId:
          type: string
          description: "Identifier used to associate the Person with a record in an external system. The value is stored with the Person and returned in Person data."
        metadata:
          type: object
          additionalProperties: true
          description: "A free-form object containing additional Person attributes."
        groups:
          type: array
          description: "Groups a person should be placed to. If no group is specified in request, a Default group is created and the person is placed to it."
          items:
            type: string
            format: uuid
        expireAt:
          type: string
          format: date-time
          description: "Person expiration date and time."

    PersonToUpdateFields:
      title: "PersonToUpdateFields"
      type: object
      description: "Person attributes that can be updated."
      properties:
        externalId:
          type: string
          description: "Identifier used to associate the Person with a record in an external system. The value is stored with the Person and returned in Person data."
        name:
          type: string
          description: "Person's name."
        metadata:
          type: object
          additionalProperties: true
          description: "A free-form object containing additional Person attributes."

    ImageFields:
      title: "ImageFields"
      type: object
      description: "Image and image-processing parameters used in an identification request."
      properties:
        tag:
          type: string
          description: "Session identifier. Should be unique for each session."
        image:
          $ref: "#/components/schemas/ImageFieldsImage"
        outputImageParams:
          $ref: "./common.yml#/components/schemas/OutputImageParams"
        detectAll:
          $ref: "./match.yml#/components/schemas/detectAll"
        threshold:
          type: number
          format: float
          default: 0.2
          description: "Maximum face distance allowed for a result to qualify as a match. A result is considered a match when its distance does not exceed this value. Lower values make matching stricter. If omitted, the default value is `0.2`."
        limit:
          type: integer
          default: 100
          description: "The maximum number of results to be returned. If not specified, the default value is 100."
          example: 5

    ImageFieldsImage:
      title: "ImageFieldsImage"
      type: object
      description: |
        Image submitted for face identification.

        Provide at least one image source: `content`, `livenessTransactionId`, or `imageUrl`.
        If multiple sources are provided, they are used in the following priority order:
        `livenessTransactionId` → `content` → `imageUrl`.
      anyOf:
        - required:
          - content
        - required:
          - livenessTransactionId
        - required:
          - imageUrl
      properties:
        contentType:
          type: string
          description: "Original media type of the uploaded image."
        content:
          $ref: "./common.yml#/components/schemas/ImageData"
        livenessTransactionId:
          type: string
          format: uuid
          description: "ID of the liveness transaction whose captured face image is used for the search."
        imageUrl:
          type: string
          description: "Location of the image to process. Supported schemes are `s3://`, `gs://`, `file://`, `http://`, and `https://`. The service must have access to the referenced resource. If multiple sources are provided, they are used in the following priority order: `livenessTransactionId` → `content` → `imageUrl`."
        resizeOptions:
            $ref: "#/components/schemas/ResizeOptions"

    AddImageToPersonResponse:
      title: "AddImageToPersonResponse"
      type: object
      description: "Image in the response."
      properties:
        id:
          type: string
          description: "ID of the added image."
        contentType:
          type: string
          description: "Original media type of the returned image."
        createdAt:
          type: string
          format: date-time
          description: "Returned image creation date and time."
        path:
          type: string
          description: "Returned image path."
        url:
          type: string
          description: "Returned image URL."
        metadata:
          type: object
          additionalProperties: true
          description: "A free-form object containing additional Person attributes."

    AddImageToPersonRequest:
      title: "AddImageToPersonRequest"
      type: object
      description: "Request for adding a face image to an existing Person."
      allOf:
        - $ref: "./common.yml#/components/schemas/TransactionLabels"
        - $ref: "#/components/schemas/AddImageToPersonRequestData"

    AddImageToPersonRequestData:
      title: "AddImageToPersonRequestData"
      type: object
      required:
        - image
      properties:
        tag:
          type: string
          description: "Session identifier."
        image:
          $ref: "#/components/schemas/AddImageToPersonRequestImage"

    AddImageToPersonRequestImage:
      title: "AddImageToPersonRequestImage"
      type: object
      description: "Uploaded image."
      properties:
        contentType:
          type: string
          description: "Original media type of the uploaded image."
        content:
          $ref: "./common.yml#/components/schemas/ImageData"
        imageUrl:
          type: string
          description: "Location of the image to add. Supported schemes are `s3://`, `gs://`, `file://`, `http://`, and `https://`. The service must have access to the referenced resource. If both `content` and `imageUrl` are provided, `content` takes precedence."
        resizeOptions:
          $ref: "#/components/schemas/ResizeOptions"

    ResizeOptions:
      title: "ResizeOptions"
      type: object
      description: "Resizes the submitted image before face processing. The face descriptor is calculated from the resized image."
      properties:
        width:
          type: integer
          description: "Width of the resized image, in pixels."
        height:
          type: integer
          description: "Height of the resized image, in pixels."
        quality:
          type: integer
          default: 100
          description: "Resized image quality, percent."

    Image:
      title: "Image"
      type: object
      description: "Image in the response."
      properties:
        id:
          type: string
          description: "Image ID."
        content:
          type: string
          format: base64
          description: "Base64-encoded image content, when included in the response."
        contentType:
          type: string
          description: "Original media type of the returned image."
        createdAt:
          type: string
          format: date-time
          description: "Returned image creation date and time."
        updatedAt:
          type: string
          format: date-time
          description: "Returned image update date and time."
        path:
          type: string
          description: "Returned image path."
        url:
          type: string
          description: "Returned image URL."
        metadata:
          type: object
          additionalProperties: true
          description: "A free-form object containing additional Person attributes."

    GroupPage:
      title: "GroupPage"
      allOf:
        - $ref: "#/components/schemas/GroupPageItems"
        - $ref: "./common.yml#/components/schemas/Page"

    GroupPageItems:
      title: "GroupPageItems"
      type: object
      properties:
        items:
          type: array
          description: "Groups returned on the current page."
          items:
            $ref: "#/components/schemas/Group"

    Group:
      title: "Group"
      allOf:
        - $ref: "#/components/schemas/GroupResponse"
        - $ref: "#/components/schemas/GroupData"

    GroupData:
      title: "GroupData"
      type: object
      description: "Service-generated Group data."
      properties:
        id:
          type: string
          format: uuid
          description: "Group ID."
        createdAt:
          type: string
          format: date-time
          description: "Group creation date and time."

    GroupResponse:
      title: "GroupResponse"
      type: object
      description: "Group attributes."
      properties:
        name:
          type: string
          description: "Group name."
        metadata:
          type: object
          additionalProperties: true
          description: "A free-form object containing additional Group attributes."

    GroupToCreate:
      title: "GroupToCreate"
      type: object
      description: "Group attributes."
      required:
        - name
      properties:
        tag:
          type: string
          description: "Session identifier."
        name:
          type: string
          description: "Group name."
        metadata:
          type: object
          additionalProperties: true
          description: "A free-form object containing additional Group attributes."
