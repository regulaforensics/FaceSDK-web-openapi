openapi: 3.0.4

paths:
  /groups:
    parameters:
      - $ref: "./common.yml#/components/parameters/x-request"
    get:
      tags:
        - group
      summary: Get groups
      description: "Returns the Groups available in the identification database. Use `page` and `size` to paginate the result."
      operationId: get_all_groups
      parameters:
        - $ref: "./common.yml#/components/parameters/page"
        - $ref: "./common.yml#/components/parameters/size"
      responses:
        200:
          description: "Returns a page of Groups."
          content:
            application/json:
              schema:
                $ref: "./identification.yml#/components/schemas/GroupPage"
        400:
          $ref: "./common.yml#/components/responses/BadRequest"

    post:
      tags:
        - group
      summary: Create group
      description: "Creates a Group in the identification database."
      operationId: create_group
      requestBody:
        description: "Attributes of the Group to create."
        required: true
        content:
          application/json:
            schema:
              $ref: "./identification.yml#/components/schemas/GroupToCreate"
      responses:
        201:
          $ref: "#/components/responses/SuccessGroup"
        400:
          $ref: "./common.yml#/components/responses/BadRequest"

  /groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/groupId"
      - $ref: "./common.yml#/components/parameters/x-request"
    get:
      tags:
        - group
      summary: Get group
      description: "Returns the Group identified by `groupId`."
      operationId: get_group
      responses:
        200:
          $ref: "#/components/responses/SuccessGroup"
        400:
          $ref: "./common.yml#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/GroupNotFound"

    put:
      tags:
        - group
      summary: Update group
      description: "Updates the Group identified by `groupId`."
      operationId: update_group
      requestBody:
        description: "Attributes of the Group to update."
        required: true
        content:
          application/json:
            schema:
              $ref: "./identification.yml#/components/schemas/GroupToCreate"
      responses:
        204:
          $ref: "#/components/responses/SuccessEmpty"
        400:
          $ref: "./common.yml#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/GroupNotFound"

    delete:
      tags:
        - group
      summary: Delete group
      description: "Deletes the Group identified by `groupId`."
      operationId: delete_group
      responses:
        204:
          $ref: "#/components/responses/SuccessEmpty"
        404:
          $ref: "#/components/responses/GroupNotFound"

  /groups/{groupId}/persons:
    parameters:
      - $ref: "#/components/parameters/groupId"
      - $ref: "./common.yml#/components/parameters/x-request"
    get:
      tags:
        - group
      summary: Get group persons
      description: "Returns the Persons associated with the specified Group. Use `page` and `size` to paginate the result."
      operationId: get_all_persons_by_group_id
      parameters:
        - $ref: "./common.yml#/components/parameters/page"
        - $ref: "./common.yml#/components/parameters/size"
      responses:
        "200":
          description: "Returns a page of Persons associated with the Group."
          content:
            application/json:
              schema:
                $ref: "./identification.yml#/components/schemas/PersonsPage"
        "400":
          $ref: "./common.yml#/components/responses/BadRequest"
        "404":
          description: "The Group specified by `groupId` was not found."
          content:
            application/json:
              schema:
                $ref: "./common.yml#/components/schemas/OperationLog"

    put:
      tags:
        - group
      summary: Add/remove persons to group
      description: "Adds Persons to or removes Persons from the Group identified by `groupId`."
      operationId: update_persons_in_group
      requestBody:
        description: "IDs of the Persons to add to or remove from the Group."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroup"
      responses:
        204:
          $ref: "#/components/responses/SuccessEmpty"
        400:
          $ref: "./common.yml#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/GroupNotFound"

components:
  parameters:
    groupId:
      name: groupId
      in: path
      description: "Group ID."
      required: true
      schema:
        type: string
        format: uuid

  responses:
    SuccessEmpty:
      description: "The operation completed successfully. No response body is returned."

    SuccessGroup:
      description: "Returns the Group."
      content:
        application/json:
          schema:
            $ref: "./identification.yml#/components/schemas/Group"

    GroupNotFound:
      description: "The Group specified by `groupId` was not found."
      content:
        application/json:
          schema:
            $ref: "./common.yml#/components/schemas/OperationLog"

  schemas:
    UpdateGroup:
      title: "UpdateGroup"
      type: object
      description: "Specifies the Persons to add to or remove from a Group."
      properties:
        addItems:
          type: array
          description: "IDs of the Persons to add to the Group."
          items:
            type: string
            format: uuid
        removeItems:
          type: array
          description: "IDs of the Persons to remove from the Group."
          items:
            type: string
            format: uuid