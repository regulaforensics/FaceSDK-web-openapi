openapi: 3.0.4

paths:
  /persons:
    parameters:
      - $ref: "./common.yml#/components/parameters/x-request"
    post:
      tags:
        - person
      summary: Create person
      description: "Creates a Person record. To associate one or more face images with the Person, add the images separately using `POST /persons/{personId}/images` after the Person is created."
      operationId: create_person
      requestBody:
        description: "Attributes of the Person to create."
        required: true
        content:
          application/json:
            schema:
              $ref: "./identification.yml#/components/schemas/PersonFields"
      responses:
        201:
          $ref: "#/components/responses/SuccessPerson"
        400:
          $ref: "./common.yml#/components/responses/BadRequest"

  /persons/{personId}:
    parameters:
      - $ref: "#/components/parameters/personId"
      - $ref: "./common.yml#/components/parameters/x-request"
    get:
      tags:
        - person
      summary: Get person
      description: "Returns the Person identified by `personId`."
      operationId: get_person
      responses:
        200:
          $ref: "#/components/responses/SuccessPerson"
        400:
          $ref: "./common.yml#/components/responses/BadRequest"
        404:
          $ref: '#/components/responses/PersonNotFound'
    put:
      tags:
        - person
      summary: Update person
      description: "Updates the Person identified by `personId`."
      operationId: update_person
      requestBody:
        description: "Attributes of the Person to update."
        required: true
        content:
          application/json:
            schema:
              $ref: "./identification.yml#/components/schemas/PersonToUpdateFields"
      responses:
        204:
          $ref: "#/components/responses/SuccessEmpty"
        400:
          $ref: "./common.yml#/components/responses/BadRequest"
        404:
          $ref: '#/components/responses/PersonNotFound'
    delete:
      tags:
        - person
      summary: Delete person
      description: "Deletes the Person identified by `personId`."
      operationId: delete_person
      responses:
        204:
          $ref: "#/components/responses/SuccessEmpty"
        400:
          $ref: "./common.yml#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/PersonNotFound"

  /persons/{personId}/images:
    parameters:
      - $ref: '#/components/parameters/personId'
      - $ref: "./common.yml#/components/parameters/x-request"
    get:
      tags:
        - person
      summary: Get person images
      description: "Returns the images associated with the specified Person. Use `page` and `size` to paginate the result."
      operationId: get_all_images_by_person_id
      parameters:
        - $ref: "./common.yml#/components/parameters/page"
        - $ref: "./common.yml#/components/parameters/size"
      responses:
        200:
          description: "Returns a page of images associated with the Person."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePage"
        400:
          $ref: "./common.yml#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/PersonNotFound"
    post:
      tags:
        - person
      summary: Add person image
      description: "Adds a face image to an existing Person. The image can be submitted directly as Base64-encoded content or provided by reference using an accessible image URL."
      operationId: add_image_to_person
      requestBody:
        description: "Face image to associate with the Person."
        required: true
        content:
          application/json:
            schema:
              $ref: "./identification.yml#/components/schemas/AddImageToPersonRequest"

      responses:
        200:
          description: "Image added successfully. Returns information about the added image."
          content:
            application/json:
              schema:
                $ref: "./identification.yml#/components/schemas/AddImageToPersonResponse"
        400:
          $ref: "./common.yml#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/PersonNotFound"

  /persons/{personId}/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/personId"
      - $ref: "./common.yml#/components/parameters/x-request"
    get:
      tags:
        - person
      summary: Get person image by ID
      description: "Returns the image identified by `imageId` for the specified Person."
      operationId: get_image_of_person
      parameters:
        - $ref: "#/components/parameters/imageId"
      responses:
        404:
          $ref: "#/components/responses/PersonNotFound"
        400:
          $ref: "./common.yml#/components/responses/BadRequest"
        200:
          description: "Image returned successfully."
          content:
            image/*:
              schema:
                type: string
                format: binary
    delete:
      tags:
        - person
      summary: Delete person image
      description: "Deletes the image identified by `imageId` from the specified Person."
      operationId: delete_image_of_person
      parameters:
        - $ref: "#/components/parameters/imageId"
      responses:
        204:
          $ref: "#/components/responses/SuccessEmpty"
        400:
          $ref: "./common.yml#/components/responses/BadRequest"
        404:
          description: "The Person specified by `personId` or the image specified by `imageId` was not found."
          content:
            application/json:
              schema:
                $ref: "./common.yml#/components/schemas/OperationLog"

  /persons/{personId}/groups:
    parameters:
      - $ref: "#/components/parameters/personId"
      - $ref: "./common.yml#/components/parameters/x-request"
    get:
      tags:
        - person
      summary: Get person groups
      description: "Returns the groups associated with the specified Person. Use `page` and `size` to paginate the result."
      operationId: get_all_groups_by_person_id
      parameters:
        - $ref: "./common.yml#/components/parameters/page"
        - $ref: "./common.yml#/components/parameters/size"
      responses:
        200:
          description: "Returns a page of groups associated with the Person."
          content:
            application/json:
              schema:
                $ref: "./identification.yml#/components/schemas/GroupPage"
        400:
          $ref: "./common.yml#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/PersonNotFound"

components:
  schemas:
    ImagePage:
      title: "ImagePage"
      description: "Paginated response containing images associated with a Person."
      allOf:
        - $ref: "./common.yml#/components/schemas/Page"
        - $ref: '#/components/schemas/ImagePageItems'

    ImagePageItems:
      title: "ImagePageItems"
      type: object
      properties:
        items:
          type: array
          description: "Images returned on the current page."
          items:
            $ref: "./identification.yml#/components/schemas/Image"

  parameters:
    personId:
      name: personId
      in: path
      description: "Person ID."
      required: true
      schema:
        format: uuid
        type: string
    imageId:
      name: imageId
      in: path
      description: "Image ID."
      required: true
      schema:
        type: string
        format: uuid
  responses:
    SuccessEmpty:
      description: "The operation completed successfully. No response body is returned."
    SuccessPerson:
      description: "Returns the Person."
      content:
        application/json:
          schema:
            $ref: "./identification.yml#/components/schemas/Person"
    PersonNotFound:
      description: "The Person specified by `personId` was not found."
      content:
        application/json:
          schema:
            $ref: "./common.yml#/components/schemas/OperationLog"
